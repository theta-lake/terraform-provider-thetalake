name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostic Check
        run: |
          if [ -z "${{ secrets.TF_ACC_TEST_CLIENT_ID }}" ]; then
            echo "❌ CLIENT_ID is MISSING"
          else
            echo "✅ CLIENT_ID is PRESENT (Length: ${#SECRET_VAL})"
          fi
        env:
          SECRET_VAL: ${{ secrets.TF_ACC_TEST_CLIENT_ID }}
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run unit tests
        run: go test ./...

  acceptance-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push'
    env:
      TF_ACC: '1'
      TF_ACC_TEST_CLIENT_ID: ${{ secrets.TF_ACC_TEST_CLIENT_ID }}
      TF_ACC_TEST_CLIENT_SECRET: ${{ secrets.TF_ACC_TEST_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run acceptance tests
        run: go test ./internal/... -run 'TestAcc'

  docs:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.4'

      - name: Generate docs
        run: go generate ./tools

      - name: Verify docs are up to date
        run: git diff --exit-code
