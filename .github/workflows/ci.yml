name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # security_scan:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v6

  #     - name: Setup Go
  #       uses: actions/setup-go@v6
  #       with:
  #         go-version: '1.25'
  #         cache: true

  #     - name: Run security scan
  #       uses: golang/govulncheck-action@v1

  unit-tests:
    runs-on: ubuntu-latest
    # needs: security_scan
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Run unit tests
        run: make testall
        env:
          TF_ACC_TEST_CLIENT_ID: ${{ secrets.TF_ACC_TEST_CLIENT_ID }}
          TF_ACC_TEST_CLIENT_SECRET: ${{ secrets.TF_ACC_TEST_CLIENT_SECRET }}
          TF_ACC_TEST_API_SERVER: ${{ secrets.TF_ACC_TEST_API_SERVER }}
          TF_ACC_TEST_INTEGRATION_NAME: ${{ vars.TF_ACC_TEST_INTEGRATION_NAME }}
          TF_ACC_TEST_RETENTION_LIBRARY_NAME: ${{ vars.TF_ACC_TEST_RETENTION_LIBRARY_NAME }}
          TF_ACC_TEST_IDENTITY_EMAIL: ${{ vars.TF_ACC_TEST_IDENTITY_EMAIL }}
          TF_ACC_TEST_USER_EMAIL: ${{ vars.TF_ACC_TEST_USER_EMAIL }}

  docs:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.3'

      - name: Generate docs
        run: go generate ./tools

      - name: Verify docs are up to date
        run: git diff --exit-code

  acceptance-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push'
    env:
      TF_ACC: '1'
      TF_ACC_TEST_CLIENT_ID: ${{ secrets.TF_ACC_TEST_CLIENT_ID }}
      TF_ACC_TEST_CLIENT_SECRET: ${{ secrets.TF_ACC_TEST_CLIENT_SECRET }}
      TF_ACC_TEST_API_SERVER: ${{ secrets.TF_ACC_TEST_API_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run acceptance tests
        run: go test ./internal/... -run 'TestAcc'

